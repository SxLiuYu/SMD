name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装依赖
        run: python -m pip install -r config/requirements/requirements-ci.txt

      - name: 检查导入
        run: |
          python -c "import sys; sys.path.insert(0, 'src'); from agent.intent_rules import normalize_intent; print('OK:', normalize_intent('music'))"

      - name: 运行测试
        run: python -m pytest src/tests/test_intent_rules.py -v --tb=long 2>&1; echo "EXIT: $?"