name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest fastapi pydantic python-dotenv requests jsonschema PyJWT cryptography rich pillow
          python -m pip list

      - name: 调试 - 检查 Python 和路径
        run: |
          python --version
          python -c "import sys; print(sys.path)"
          ls src/tests/*.py | wc -l

      - name: 调试 - 单个测试文件收集
        run: |
          python -m pytest src/tests/test_intent_rules.py --collect-only -q 2>&1 || true
          python -m pytest src/tests/test_reminders.py --collect-only -q 2>&1 || true
          python -m pytest src/tests/test_security_fixes.py --collect-only -q 2>&1 || true

      - name: 调试 - 全量收集
        run: python -m pytest src/tests --collect-only -q 2>&1 || true

      - name: 运行测试
        run: python -m pytest src/tests -q --ignore=src/tests/test_voice_server.py --ignore=src/tests/test_voice_agent.py --ignore=src/tests/test_xiaozhi_ws.py --ignore=src/tests/test_model_download.py --ignore=src/tests/test_runtime_resilience.py --tb=short