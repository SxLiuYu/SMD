name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装依赖
        run: python -m pip install pytest fastapi pydantic python-dotenv requests jsonschema PyJWT cryptography

      - name: 运行测试
        run: |
          python -m pytest src/tests/test_intent_rules.py -q --tb=short
          python -m pytest src/tests/test_reminders.py -q --tb=short
          python -m pytest src/tests/test_security_fixes.py -q --tb=short
          python -m pytest src/tests/test_state.py -q --tb=short
          python -m pytest src/tests/test_config.py -q --tb=short
          python -m pytest src/tests/test_utils.py -q --tb=short
          python -m pytest src/tests/test_mcp_gate.py -q --tb=short