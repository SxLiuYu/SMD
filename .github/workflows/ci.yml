name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装依赖
        run: |
          python -m pip install pytest fastapi pydantic python-dotenv requests jsonschema PyJWT cryptography dashscope
          echo "--- pip freeze ---"
          python -m pip freeze | head -20

      - name: 验证 Python
        run: |
          python -c "print('Python OK')"
          python -c "import sys; sys.path.insert(0, 'src'); print('sys.path OK')"

      - name: 运行测试
        run: |
          python -m pytest src/tests/test_intent_rules.py -v --tb=long 2>&1
          echo "EXIT_CODE=$?"