<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Charlie 欢迎引导</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;background:#0f0f17;color:#e0e0e0;min-height:100vh;display:flex;justify-content:center;align-items:center;padding:20px}
.card{background:#1a1a2e;border-radius:16px;padding:40px;max-width:520px;width:100%;box-shadow:0 8px 32px rgba(0,0,0,.4)}
h1{font-size:26px;margin-bottom:8px;text-align:center}
.subtitle{color:#888;font-size:14px;text-align:center;margin-bottom:28px}
.step{display:none}
.step.active{display:block}
.mode-btn{display:block;width:100%;padding:16px;margin-bottom:12px;background:#20202e;border:1px solid #333;border-radius:10px;color:#e0e0e0;font-size:15px;text-align:left;cursor:pointer;transition:all .2s}
.mode-btn:hover{border-color:#667eea;background:#252535}
.mode-btn .title{font-weight:600;display:block}
.mode-btn .desc{font-size:12px;color:#888;margin-top:4px}
.mode-btn .icon{font-size:24px;margin-right:8px}
.btn{width:100%;padding:14px;background:linear-gradient(135deg,#667eea,#764ba2);border:none;border-radius:10px;color:#fff;font-size:16px;font-weight:600;cursor:pointer;margin-top:8px}
.btn:active{opacity:.8}
.hint{font-size:13px;color:#888;line-height:1.6;margin:16px 0;padding:14px;background:#20202e;border-radius:8px}
.hint code{background:#0f0f17;padding:2px 6px;border-radius:4px;color:#667eea;font-size:12px}
.progress{text-align:center;margin-bottom:24px}
.progress .dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:#333;margin:0 6px}
.progress .dot.active{background:#667eea}
.link-row{text-align:center;margin-top:16px}
.link-row a{color:#667eea;text-decoration:none;font-size:13px}
</style>
</head>
<body>
<div class="card">
<h1>🎙️ 欢迎</h1>
<p class="subtitle">3 步配置，让 Charlie 为你服务</p>

<div class="progress">
  <span class="dot active" id="dot1"></span>
  <span class="dot" id="dot2"></span>
  <span class="dot" id="dot3"></span>
</div>

<!-- 步骤1：选模式 -->
<div class="step active" id="step1">
  <button class="mode-btn" onclick="selectMode('demo')">
    <span class="icon">⚡</span><span class="title">Demo 规则模式</span>
    <span class="desc">零配置即可用。报时间、场景触发等快路径能力。无需任何 key</span>
  </button>
  <button class="mode-btn" onclick="selectMode('ollama')">
    <span class="icon">🖥️</span><span class="title">Ollama 离线模式</span>
    <span class="desc">本地 LLM 对话，无需云端 key。需先安装 Ollama + 拉取模型</span>
  </button>
  <button class="mode-btn" onclick="selectMode('full')">
    <span class="icon">🚀</span><span class="title">完整模式（填 key）</span>
    <span class="desc">配置 ARK/百度/高德 key，解锁天气/翻译/记忆/飞书等全部能力</span>
  </button>
</div>

<!-- 步骤2：分支 -->
<div class="step" id="step2"></div>

<!-- 步骤3：完成 -->
<div class="step" id="step3">
  <p style="text-align:center;font-size:18px;margin-bottom:16px">✅ 配置完成！</p>
  <p style="text-align:center;color:#888;font-size:14px;margin-bottom:20px">Charlie 已准备好为你服务</p>
  <button class="btn" onclick="location.href='/'">进入主界面 →</button>
</div>

</div>

<script>
let mode='';
async function loadStatus(){
  try{
    const r=await fetch('/api/welcome/status');const d=await r.json();
    if(d.has_env&&!d.demo_mode&&d.ollama_online){goStep3();return}
    if(d.has_env&&!d.missing_required.length){goStep3();return}
  }catch(e){}
}
function selectMode(m){mode=m;goStep2()}
function goStep2(){
  document.getElementById('step1').classList.remove('active');
  document.getElementById('step2').classList.add('active');
  document.getElementById('dot2').classList.add('active');
  const s2=document.getElementById('step2');
  if(mode==='demo'){
    s2.innerHTML=`<div class="hint">Demo 规则模式无需配置。点击完成即可使用报时间、场景触发等快路径能力。</div>
      <button class="btn" onclick="finishDemo()">完成 →</button>`;
  }else if(mode==='ollama'){
    s2.innerHTML=`<div class="hint">
      <p style="margin-bottom:8px"><b>安装 Ollama：</b></p>
      <p><code>brew install ollama</code>（macOS）</p>
      <p><code>curl -fsSL https://ollama.com/install.sh | sh</code>（Linux）</p>
      <p style="margin:8px 0"><b>启动服务 + 拉取模型：</b></p>
      <p><code>ollama serve &</code></p>
      <p><code>ollama pull qwen3.5:2b</code></p>
      <p style="margin-top:12px;color:#667">安装完成后点击下方按钮检测</p>
    </div>
    <button class="btn" id="checkOllama" onclick="checkOllama()">检测 Ollama →</button>`;
  }else if(mode==='full'){
    s2.innerHTML=`<div class="hint">即将跳转配置页面填写 API 密钥。准备好 ARK_KEY、百度三件套、高德 KEY。</div>
      <button class="btn" onclick="location.href='/setup'">去填写 key →</button>
      <button class="mode-btn" style="margin-top:8px;text-align:center" onclick="goStep3()">已配置好，完成 →</button>`;
  }
}
async function finishDemo(){
  try{
    await fetch('/api/setup',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({demo_accept:'true'})});
  }catch(e){}
  goStep3();
}
async function checkOllama(){
  const btn=document.getElementById('checkOllama');
  btn.textContent='检测中...';btn.disabled=true;
  try{
    const r=await fetch('/api/welcome/status');const d=await r.json();
    if(d.ollama_online){
      btn.textContent='✅ Ollama 在线';btn.style.background='#27ae60';
      setTimeout(goStep3,1000);
    }else{
      btn.textContent='❌ Ollama 未就绪，请先安装';btn.disabled=false;
    }
  }catch(e){btn.textContent='检测失败';btn.disabled=false}
}
function goStep3(){
  document.querySelectorAll('.step').forEach(s=>s.classList.remove('active'));
  document.getElementById('step3').classList.add('active');
  document.getElementById('dot3').classList.add('active');
}
loadStatus();
</script>
</body>
</html>
