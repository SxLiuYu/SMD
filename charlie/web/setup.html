<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Charlie 配置</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#0f0f17;color:#e0e0e0;min-height:100vh;display:flex;justify-content:center;align-items:flex-start;padding:20px}
.card{background:#1a1a2e;border-radius:16px;padding:32px;max-width:680px;width:100%;box-shadow:0 8px 32px rgba(0,0,0,.4)}
h1{font-size:24px;margin-bottom:6px;display:flex;align-items:center;gap:10px}
h1 .icon{width:36px;height:36px;background:linear-gradient(135deg,#667eea,#764ba2);border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:20px}
.subtitle{color:#888;font-size:14px;margin-bottom:20px}
.banner{padding:12px 14px;border-radius:8px;font-size:13px;margin-bottom:16px}
.banner.demo{background:#f39c1222;color:#f39c12;border:1px solid #f39c1244}
.banner.ok{background:#27ae6022;color:#27ae60;border:1px solid #27ae6044}
.banner.err{background:#e74c3c22;color:#e74c3c;border:1px solid #e74c3c44}
.group{margin-bottom:18px;border:1px solid #2a2a3e;border-radius:10px;overflow:hidden}
.group-title{font-size:14px;font-weight:600;padding:10px 14px;background:#20202e;display:flex;align-items:center;justify-content:space-between;cursor:pointer;user-select:none}
.group-title .chev{transition:transform .2s;color:#888}
.group.collapsed .chev{transform:rotate(-90deg)}
.group.collapsed .group-body{display:none}
.group-body{padding:10px 14px}
.field{margin-bottom:10px}
.field:last-child{margin-bottom:0}
.field label{display:flex;align-items:center;justify-content:space-between;font-size:13px;color:#aaa;margin-bottom:4px;gap:8px}
.field label .key{font-family:monospace;color:#667eea;font-size:12px;flex:1}
.badge{font-size:10px;padding:2px 6px;border-radius:4px;font-weight:400;white-space:nowrap}
.badge.required{background:#e74c3c22;color:#e74c3c}
.badge.optional{background:#27ae6022;color:#27ae60}
.badge.demo{background:#f39c1222;color:#f39c12}
.badge.set{background:#3498db22;color:#3498db}
.field input{width:100%;padding:9px 11px;background:#0f0f17;border:1px solid #333;border-radius:7px;color:#e0e0e0;font-size:14px;outline:none;transition:border .2s}
.field input:focus{border-color:#667eea}
.field .hint{font-size:11px;color:#666;margin-top:3px}
.field .hint a{color:#667eea;text-decoration:none}
.demo-check{margin:8px 0 16px;padding:10px 14px;background:#f39c1222;border:1px solid #f39c1244;border-radius:8px;font-size:13px;color:#f39c12;display:flex;align-items:center;gap:8px}
.demo-check input{width:auto}
.btn{width:100%;padding:14px;background:linear-gradient(135deg,#667eea,#764ba2);border:none;border-radius:10px;color:#fff;font-size:16px;font-weight:600;cursor:pointer;transition:opacity .2s}
.btn:active{opacity:.8}
.btn:disabled{opacity:.4;cursor:not-allowed}
.link-row{margin-top:16px;text-align:center}
.link-row a{color:#667eea;text-decoration:none;font-size:13px}
</style>
</head>
<body>
<div class="card">
<h1><span class="icon">🎙️</span> Charlie 配置</h1>
<p class="subtitle">按分组填写 API 密钥。未配置的项会自动降级或禁用。首次配置 3 分钟。</p>

<div id="banner" class="banner" style="display:none"></div>
<div id="groups"></div>

<div id="demoBox" class="demo-check" style="display:none">
  <input type="checkbox" id="demoAccept">
  <label for="demoAccept">使用 Demo 模式（Ollama 本地模型，无需 ARK_KEY）</label>
</div>

<button class="btn" id="saveBtn" onclick="save()">保存配置</button>
<div class="link-row"><a href="/">← 返回首页</a></div>
</div>

<script>
let groups=[], values={}, demoActive=false, llmAvailable=false;

async function load(){
  try{
    // 并行拉分组结构和当前值
    const [sr, vr] = await Promise.all([fetch('/api/setup/mcp-status'), fetch('/api/setup')]);
    if(sr.ok) groups = (await sr.json()).groups || [];
    if(vr.ok){
      const d = await vr.json();
      values = d;
      demoActive = !!d.__demo_mode;
      llmAvailable = !!d.__llm_available;
    }
  }catch(e){console.error('load failed', e)}
  renderBanner();
  renderGroups();
  renderDemoBox();
}

function renderBanner(){
  const b = document.getElementById('banner');
  if(demoActive){
    b.className = 'banner demo';
    b.textContent = '⚠️ 当前为 Demo 模式（未配置 ARK_KEY）。大脑使用 Ollama 本地模型，能力有限。填写 ARK_KEY 或勾选下方「Demo 模式」可保存。';
    b.style.display = 'block';
  }else if(llmAvailable){
    b.className = 'banner ok';
    b.textContent = '✅ ARK_KEY 已配置，大脑使用完整模式';
    b.style.display = 'block';
  }
}

function renderGroups(){
  const root = document.getElementById('groups');
  root.innerHTML = '';
  groups.forEach((g, gi) => {
    const collapsed = g.key !== 'core' ? ' collapsed' : '';
    const groupEl = document.createElement('div');
    groupEl.className = 'group' + collapsed;
    // 统计该组已配置数
    const setCount = g.entries.filter(e => e.configured).length;
    const total = g.entries.length;
    groupEl.innerHTML = `
      <div class="group-title" onclick="this.parentElement.classList.toggle('collapsed')">
        <span>${g.label}</span>
        <span style="font-size:11px;color:#888">${setCount}/${total} 已配置 <span class="chev">▼</span></span>
      </div>
      <div class="group-body">${g.entries.map(e => fieldHtml(e)).join('')}</div>
    `;
    root.appendChild(groupEl);
  });
}

function fieldHtml(e){
  const val = values[e.name] || '';
  const type = e.secret ? 'password' : 'text';
  let badge = '';
  if(e.required) badge = `<span class="badge required">必需</span>`;
  else if(e.demo_supported) badge = `<span class="badge demo">Demo可用</span>`;
  else badge = `<span class="badge optional">可选</span>`;
  if(e.configured) badge += ` <span class="badge set">已配置</span>`;
  const hint = e.description ? `<div class="hint">${e.description}${e.get_guide ? ` · <a href="${e.get_guide}" target="_blank">获取</a>` : ''}</div>` : '';
  const ph = e.required ? '（必需）' : (e.default ? `默认: ${e.default}` : '');
  return `<div class="field">
    <label><span class="key">${e.name}</span>${badge}</label>
    <input type="${type}" id="fld_${e.name}" data-key="${e.name}" value="${escapeAttr(val)}" placeholder="${escapeAttr(ph)}" autocomplete="off">
    ${hint}
  </div>`;
}

function renderDemoBox(){
  const box = document.getElementById('demoBox');
  // 缺失必需项时显示 Demo 勾选框
  const missingRequired = groups.flatMap(g => g.entries).filter(e => e.required && !e.configured);
  if(missingRequired.length > 0){
    box.style.display = 'flex';
    document.getElementById('demoAccept').checked = demoActive;
  }else{
    box.style.display = 'none';
  }
}

function escapeAttr(s){return String(s||'').replace(/"/g,'&quot;').replace(/</g,'&lt;')}

async function save(){
  const btn = document.getElementById('saveBtn');
  const b = document.getElementById('banner');
  btn.disabled = true; btn.textContent = '保存中...';
  // 收集所有字段
  const data = {};
  document.querySelectorAll('input[data-key]').forEach(el => {
    const k = el.dataset.key;
    if(k && !k.startsWith('__')) data[k] = el.value;
  });
  data.demo_accept = document.getElementById('demoAccept').checked ? 'true' : 'false';
  try{
    const r = await fetch('/api/setup', {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});
    const d = await r.json();
    if(d.ok){
      b.className = 'banner ok';
      b.textContent = '✅ 配置已保存，需要重启 Charlie 生效';
      b.style.display = 'block';
      btn.textContent = '已保存';
    }else{
      b.className = 'banner err';
      b.textContent = '❌ ' + (d.error || '保存失败');
      b.style.display = 'block';
      btn.disabled = false; btn.textContent = '保存配置';
    }
  }catch(e){
    b.className = 'banner err';
    b.textContent = '❌ 网络错误';
    b.style.display = 'block';
    btn.disabled = false; btn.textContent = '保存配置';
  }
}

load();
</script>
</body>
</html>
